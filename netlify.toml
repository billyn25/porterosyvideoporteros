[build]
  command = "npm run build:production && npm run check"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/search-index.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "https://www.instalacionvideoporterourgente.com/*"
  to = "https://instalacionvideoporterourgente.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.instalacionvideoporterourgente.com/*"
  to = "https://instalacionvideoporterourgente.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://instalacionvideoporterourgente.com/*"
  to = "https://instalacionvideoporterourgente.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/porteros-videoporteros/"
  to = "/zonas/"
  status = 301

[[redirects]]
  from = "/porteros-videoporteros/guipuzcoa/*"
  to = "/porteros-videoporteros/gipuzkoa/:splat"
  status = 301

[[redirects]]
  from = "/porteros-videoporteros/vizcaya/*"
  to = "/porteros-videoporteros/bizkaia/:splat"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
